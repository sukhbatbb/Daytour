<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — Mongol.Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v=2">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="/index.html">Mongol<span>.</span>Tours</a>
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/tours.html">Tours</a>
      <a href="/destinations.html">Destinations</a>
      <a href="/about.html">About</a>
      <a href="/faq.html" class="active">FAQ</a>
      <a href="/contact.html">Contact</a>
    </div>
    <a class="btn btn-sm" href="/contact.html">Plan a trip</a>
  </div>
</nav>

<header class="hero" style="padding-top:70px; padding-bottom:56px;">
  <div class="wrap">
    <div class="eyebrow">FAQ</div>
    <h1 style="font-size:clamp(2.2rem,4vw,3.2rem);">Practical questions</h1>
  </div>
</header>

<section>
  <div class="wrap" style="max-width:720px;">
    <div id="faq-list"><div class="empty-state">Loading…</div></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div><h4>Mongol.Tours</h4><p style="max-width:28ch; font-size:.88rem;">Small-group tours across Mongolia, anchored by Mongol Culture Park.</p></div>
    <div><h4>Explore</h4><p><a href="/tours.html">Tours</a></p><p><a href="/destinations.html">Destinations</a></p><p><a href="/about.html">About</a></p></div>
    <div><h4>Support</h4><p><a href="/faq.html">FAQ</a></p><p><a href="/contact.html">Contact</a></p></div>
  </div>
  <div class="wrap footer-bottom"><span>© <span id="year"></span> Mongol.Tours</span><span>Ulaanbaatar, Mongolia</span></div>
</footer>

<script type="module">
  import { getFaqItems } from "/assets/js/content-data.js";
  import { escapeHtml, emptyStateHTML } from "/assets/js/render.js";

  document.getElementById("year").textContent = new Date().getFullYear();

  const items = await getFaqItems();
  const listEl = document.getElementById("faq-list");
  listEl.innerHTML = items.length
    ? items.map(f => `
        <div class="faq-item">
          <div class="q">${escapeHtml(f.q)}</div>
          <p class="muted">${escapeHtml(f.a)}</p>
        </div>`).join("")
    : emptyStateHTML("FAQ hasn't been added yet — check back soon.");
</script>
</body>
</html>
